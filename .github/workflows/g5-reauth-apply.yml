name: G5 REAUTH One Shot Apply

on:
  push:
    branches:
      - chatgpt/g5-reauth-backend-20260821
    paths:
      - '.github/workflows/g5-reauth-apply.yml'

permissions:
  contents: write

jobs:
  apply-reauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/g5-reauth-backend-20260821
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic patch
        run: node tools/apply-g5-reauth.js

      - name: Run REAUTH test
        run: node tests/g5-token-sessao/test-reauth-required-backend.js

      - name: Run full portable G5 suite
        run: node tests/g5-token-sessao/run-all-portable.js

      - name: Verify final runtime diff
        run: |
          git status --short
          git diff --check
          grep -RIn "if (!identidade.ok) return _recusa(" Código.js HMAC_Onda2.js && exit 1 || true

      - name: Remove one-shot applicator
        run: |
          rm -f tools/apply-g5-reauth.js
          rm -f .github/workflows/g5-reauth-apply.yml
          rmdir tools 2>/dev/null || true

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(g5): implementar contrato REAUTH_REQUIRED backend"
          git push origin HEAD:chatgpt/g5-reauth-backend-20260821
