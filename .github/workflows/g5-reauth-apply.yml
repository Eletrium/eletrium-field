name: G5 REAUTH Patch Proof

on:
  pull_request:
    branches:
      - active-os-backend-v2.1-20260815
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prove-reauth-patch:
    if: github.head_ref == 'chatgpt/g5-reauth-backend-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/g5-reauth-backend-20260821

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic patch in runner only
        run: node tools/apply-g5-reauth.js

      - name: Run REAUTH test
        run: node tests/g5-token-sessao/test-reauth-required-backend.js

      - name: Run full portable G5 suite
        run: node tests/g5-token-sessao/run-all-portable.js

      - name: Verify prospective diff
        run: |
          git status --short
          git diff --check
          grep -RIn "if (!identidade.ok) return _recusa(" Código.js HMAC_Onda2.js && exit 1 || true
          test ! -f HMAC_Reauth.js
